<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#64748b" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="630" stroke="#64748b" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#64748b" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#64748b" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#64748b" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="#64748b" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#64748b" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="#64748b" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#64748b" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#64748b" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#64748b" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="#64748b" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="630" stroke="#64748b" stroke-width="1"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#64748b" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#64748b" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#64748b" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#64748b" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#64748b" stroke-width="1"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="950" cy="150" r="80" fill="#3b82f6" opacity="0.15"/>
  <circle cx="1050" cy="500" r="120" fill="#8b5cf6" opacity="0.1"/>
  <circle cx="150" cy="480" r="60" fill="#3b82f6" opacity="0.1"/>

  <!-- Ethereum icon -->
  <g transform="translate(100, 200)">
    <path d="M50 0 L100 85 L50 115 L0 85 Z" fill="#3b82f6" opacity="0.3"/>
    <path d="M50 125 L100 95 L50 170 L0 95 Z" fill="#8b5cf6" opacity="0.3"/>
  </g>

  <!-- Title -->
  <text x="280" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#f8fafc">Compassus</text>

  <!-- Subtitle -->
  <text x="280" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#94a3b8">Ethereum Developer Tooling</text>

  <!-- Features -->
  <g transform="translate(280, 400)">
    <rect x="0" y="0" width="200" height="40" rx="8" fill="#3b82f6" opacity="0.2"/>
    <text x="20" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#93c5fd">Arbitrary Call</text>

    <rect x="220" y="0" width="200" height="40" rx="8" fill="#8b5cf6" opacity="0.2"/>
    <text x="240" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#c4b5fd">Storage Inspect</text>

    <rect x="440" y="0" width="160" height="40" rx="8" fill="#06b6d4" opacity="0.2"/>
    <text x="460" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#67e8f9">Trace Tx</text>
  </g>

  <!-- URL -->
  <text x="280" y="540" font-family="monospace" font-size="20" fill="#64748b">compassus.pages.dev</text>

  <!-- Border accent -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)"/>
</svg>
